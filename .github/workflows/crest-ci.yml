name: Android CI

on:
  push:
    branches: [ experiment/c-editor-engine, main, master ]
  pull_request:
    branches: [ experiment/c-editor-engine, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK Environment
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Found Android NDK at: $NDK_PATH"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Run Rust Engine Unit Tests
        run: |
          cd crest_editor_engine
          cargo test

      - name: Build Rust Native Engine for Android arm64-v8a
        run: |
          cd crest_editor_engine
          cargo ndk -t arm64-v8a build --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcrest_editor_engine.so ../app/src/main/jniLibs/arm64-v8a/libcrest_editor.so || cp ../target/aarch64-linux-android/release/libcrest_editor_engine.so ../app/src/main/jniLibs/arm64-v8a/libcrest_editor.so

      - name: Build Debug APK
        run: gradle assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crestcode-debug
          path: app/build/outputs/apk/release/app-release.apk
