name: Android CI

on:
  push:
    branches: [ experiment/c-editor-engine, main, master ]
  pull_request:
    branches: [ experiment/c-editor-engine, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: npathai/setup-ndk@v2
        with:
          ndk-version: r25c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true

      - name: Run Rust Engine Unit Tests
        run: |
          cd crest_editor_engine
          cargo test

      - name: Build Rust Native Engine for Android arm64-v8a
        run: |
          cd crest_editor_engine
          cargo ndk -t arm64-v8a build --release
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libcrest_editor_engine.so ../app/src/main/jniLibs/arm64-v8a/libcrest_editor.so || cp ../target/aarch64-linux-android/release/libcrest_editor_engine.so ../app/src/main/jniLibs/arm64-v8a/libcrest_editor.so

      - name: Run Android Unit Tests
        run: gradle test

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crestcode-debug
          path: app/build/outputs/apk/debug/app-debug.apk
