[package]
name = "crest_editor_engine"
version = "0.1.0"
edition = "2021"
authors = ["CrestCode Team"]
description = "Native high-performance Rust Editor Engine for CrestCode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
lazy_static = "1.4"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.8"
