name: Crest Mobile UI Interceptor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Run Crest Interceptor Proof-of-Concept Tests
        run: |
          npm test

      - name: Verify Architecture Cleanliness
        run: |
          echo "Checking that no legacy RPC or fake extension host files are included..."
          ! grep -rnw "." -e "fakeExtensionHost" -e "legacyRPC" --exclude-dir=node_modules || exit 1
          echo "Clean architecture verified!"
