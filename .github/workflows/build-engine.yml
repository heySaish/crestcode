name: Build Crest Code Engine & Extension Host

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CrestCode Repo
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libx11-dev libxkbfile-dev

      - name: Clone VS Code Core Engine
        run: |
          echo "Cloning VS Code core repository..."
          git clone --depth 1 https://github.com/microsoft/vscode.git vscode-core

      - name: Install Dependencies & Compile
        run: |
          cd vscode-core
          npm ci
          npx gulp compile

      - name: Prune & Package Ultra-Lightweight ARM64 Bundle
        run: |
          mkdir -p dist/engine/out
          cp -r vscode-core/out/* dist/engine/out/

          # Prune devDependencies (removes playwright, electron dev tools, build junk)
          cd vscode-core
          npm prune --omit=dev
          cd ..

          # Delete Windows, Mac, x86 binary bloat (keep only linux-arm64 / android-arm64)
          find vscode-core/node_modules -type d -name "*win32*" -exec rm -rf {} + 2>/dev/null || true
          find vscode-core/node_modules -type d -name "*darwin*" -exec rm -rf {} + 2>/dev/null || true
          find vscode-core/node_modules -type d -name "*x64*" ! -name "*arm64*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf vscode-core/node_modules/@playwright 2>/dev/null || true
          rm -rf vscode-core/node_modules/electron 2>/dev/null || true

          cp -r vscode-core/node_modules dist/engine/node_modules
          if [ -d "vscode-core/out-vscode-web" ]; then
            cp -r vscode-core/out-vscode-web/* dist/engine/web-workbench/
          fi
          echo "Ultra-lightweight ARM64 Engine ready!"

      - name: Upload Lightweight Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crest-vscode-engine
          path: dist/engine/
